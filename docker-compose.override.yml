version: '3.8'

services:
  # Expose Postgres locally
  db:
    ports:
      - "5432:5432"

  # Expose Backend locally
  backend:
    environment:
      # Use localhost for local dev
      PUBLIC_BASE_URL: http://localhost:8088
      BASE_DOMAIN: localhost
    ports:
      - "5000:5000"

  # Expose Frontend locally
  frontend:
    environment:
      VITE_BASE_DOMAIN: localhost
      VITE_PORT: 8088
    ports:
      - "5173:5173"

  # Nginx with local config
  nginx:
    ports:
      - "8088:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf
      - static_sites:/srv/static-sites

server {
    listen 80;
    server_name 93.127.199.118.sslip.io;

    # Backend API Proxy
    # Matches /api/auth, /api/github, etc.
    # We pass the full path to backend because Express expects /api/...
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Proxy
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------
# WILDCARD SUBDOMAINS for static sites
# ------------------------------------------------------------
server {
    listen 80;
    # Matches: anything.93.127.199.118.sslip.io
    server_name ~^(?<slug>.+)\.93\.127\.199\.118\.sslip\.io$;

    root /srv/static-sites/$slug/current;
    index index.html;

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vpsbuilds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ✅ Do NOT expose Postgres publicly on VPS
    # ports:
    #   - "5432:5432"

  backend:
    build: ./vps-back
    environment:
      DATABASE_URL: postgres://admin:password@db:5432/vpsbuilds
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:-supersecretDefault}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      STATIC_SITES_PATH: /srv/static-sites
      PORT: 5000
      # Single source of truth for public URL
      PUBLIC_BASE_URL: http://93.127.199.118.sslip.io:8088
      BASE_DOMAIN: 93.127.199.118.sslip.io
      GATEWAY_NETWORK: vpsbuilds_default
      NGINX_CONTAINER: vpsbuild-nginx-1
      DOCKER_ENV: "true"
    volumes:
      - static_sites:/srv/static-sites
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway_projects:/nginx/projects
    depends_on:
      - db

  frontend:
    build: ./vps-front
    environment:
      # Relative path allows Nginx to handle routing
      VITE_API_BASE: /api
      VITE_BASE_DOMAIN: 93.127.199.118.sslip.io
      VITE_PORT: 8088
    # In production, run from the built image (no bind mounts).
    # ✅ Do NOT expose vite dev server publicly on VPS
    # ports:
    #   - "5173:5173"

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx-vps.conf:/etc/nginx/conf.d/default.conf
      - static_sites:/srv/static-sites
      - gateway_projects:/etc/nginx/conf.d/projects
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_sites:
  gateway_projects:

networks:
  default:
    name: vpsbuilds_default

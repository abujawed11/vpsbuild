version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vpsbuilds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ✅ Do NOT expose Postgres publicly on VPS
    # ports:
    #   - "5432:5432"

  backend:
    build: ./vps-back
    environment:
      DATABASE_URL: postgres://admin:password@db:5432/vpsbuilds
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:-supersecretDefault}
      STATIC_SITES_PATH: /srv/static-sites
      PORT: 5000
    volumes:
      - ./vps-back:/app
      - /app/node_modules
      - static_sites:/srv/static-sites
    # ✅ No public port needed (nginx will proxy internally)
    # ports:
    #   - "5000:5000"
    depends_on:
      - db

  frontend:
    build: ./vps-front
    environment:
      # ✅ Point to nginx since nginx is the public entrypoint
      VITE_API_URL: http://93.127.199.118.sslip.io/api
      VITE_BASE_DOMAIN: 93.127.199.118.sslip.io
    volumes:
      - ./vps-front:/app
      - /app/node_modules
    # ✅ Do NOT expose vite dev server publicly on VPS
    # ports:
    #   - "5173:5173"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-vps.conf:/etc/nginx/conf.d/default.conf
      - static_sites:/srv/static-sites
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_sites:

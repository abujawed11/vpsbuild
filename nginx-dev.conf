server {
    listen 80;
    server_name localhost 127.0.0.1.sslip.io;

    # Allow larger uploads (ZIP uploads go through /api/*)
    client_max_body_size 110m;

    # Backend API
    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Include dynamic project configs (server containers at /apps/<slug>/)
    include /etc/nginx/conf.d/projects/*.conf;

    # Frontend Dashboard
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------
# WILDCARD SUBDOMAINS (The Magic Part)
# ------------------------------------------------------------
server {
    listen 80;
    # Matches anything.localhost (e.g. my-blog.localhost)
    server_name ~^(?<slug>.+)\.localhost$;

    # Map to the volume where backend writes files
    root /srv/static-sites/$slug/current;
    index index.html;

    # SPA Fallback: if file not found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------
# WILDCARD SUBDOMAINS (Windows-friendly via sslip.io)
# ------------------------------------------------------------
server {
    listen 80;
    # Matches anything.127.0.0.1.sslip.io (e.g. my-blog.127.0.0.1.sslip.io)
    server_name ~^(?<slug>.+)\.127\.0\.0\.1\.sslip\.io$;

    root /srv/static-sites/$slug/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name localhost;

    # Backend API (Optional proxy if you want to access via port 80)
    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend Dashboard (Optional proxy)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------
# WILDCARD SUBDOMAINS (The Magic Part)
# ------------------------------------------------------------
server {
    listen 80;
    # Matches anything.localhost (e.g. my-blog.localhost)
    server_name ~^(?<slug>.+)\.localhost$;

    # Map to the volume where backend writes files
    root /srv/static-sites/$slug/current;
    index index.html;

    # SPA Fallback: if file not found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
